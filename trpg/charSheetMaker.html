<!DOCTYPE html>
<html>
<head>
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="https://necolas.github.io/normalize.css/8.0.1/normalize.css" />
    <link rel="stylesheet" href="charSheetMaker.css" />
    <script type="module" defer src="charSheetMaker.js"></script>
</head>

<body>
    <nav>
        <button type="button" class="icon" popovertarget="editor-dialog">
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24">
              <path d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zM20.71 7.04c.39-.39.39-1.02 0-1.41l-2.34-2.34c-.39-.39-1.02-.39-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z" fill="currentColor" />
            </svg>
        </button>
    </nav>
    <main id="preview"></main>
    <dialog id="editor-dialog" popover>
        <div id="editor"></div>
        <input id="editor-upload-input" type="file" accept=".mdx" />
        <footer class="action-container">
            <button class="border" type="button" id="editor-save">Save</button>
            <button class="border" type="button" id="editor-upload">Load</button>
            <button class="border" type="button" id="editor-submit">Submit</button>
            <button class="border" type="button" popovertarget="editor-dialog" popovertargetaction="hide" id="editor-close">Cancel</button>
        </footer>
    </dialog>
</body>
</html>
